<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Homework 01</title>

    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f4f6f9;
        font-family: Arial, sans-serif;
      }

      .card {
        background: #ffffff;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        text-align: center;
        width: 300px;
      }

      h1 {
        margin-bottom: 20px;
        font-size: 22px;
        color: #333;
      }

      button {
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        background: #4f46e5;
        color: white;
        cursor: pointer;
        transition: 0.2s ease;
      }

      button:hover {
        background: #3730a3;
      }

      .output {
        margin-top: 20px;
        font-weight: bold;
        color: #111;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>js-homework-01</h1>
      <button onclick="runHomework()">Run</button>
      <div class="output" id="output"></div>
    </div>

    <script src="./js/task-1.js"></script>
  </body>
</html>
